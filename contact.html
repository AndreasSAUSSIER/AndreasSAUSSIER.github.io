<!DOCTYPE html>
<html lang="fr">
<head>
    <title>Contact — Andréas Saussier</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        /* =============================================
           VARIABLES — même palette que index.html
        ============================================= */
        :root {
            --bg:           #212122;
            --bg-dark:      #1a1a1b;
            --accent:       #4d54da;
            --accent-hover: #4145bb;
            --text:         #ffffff;
            --text-dim:     #a0a0b0;
            --card-bg:      #2a2a2c;
            --font:         'JetBrains Mono', monospace;
        }

        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        html { scroll-behavior: smooth; }

        body {
            font-family: var(--font);
            background-color: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* ===== NAVIGATION ===== */
        header {
            position: sticky;
            top: 0;
            z-index: 100;
            background-color: var(--bg-dark);
            border-bottom: 1px solid rgba(77, 84, 218, 0.25);
            backdrop-filter: blur(8px);
        }

        nav {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 24px;
            height: 64px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .nav-logo {
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--accent);
            text-shadow: 0 0 10px rgba(77, 84, 218, 0.6);
        }

        nav ul {
            list-style: none;
            display: flex;
            gap: 8px;
        }

        nav ul li a {
            display: inline-block;
            padding: 6px 18px;
            font-size: 0.75rem;
            font-family: var(--font);
            font-weight: 700;
            color: var(--text);
            text-decoration: none;
            background-color: var(--accent);
            border-radius: 5px;
            transition: background-color 0.3s ease, transform 0.3s ease, box-shadow 0.3s ease;
        }

        nav ul li a:hover, nav ul li a.active {
            background-color: var(--accent-hover);
            transform: scale(1.08);
            box-shadow: 0 0 6px var(--accent), 0 0 20px rgba(77, 84, 218, 0.45);
        }

        /* ===== HERO CONTACT ===== */
        .page-hero {
            position: relative;
            min-height: 340px;
            display: flex;
            align-items: flex-end;
            overflow: hidden;
            background-image: url('Background_Contact.jpg');
            background-size: cover;
            background-position: center;
        }

        .page-hero::before {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(
                to bottom,
                rgba(33,33,34,0.5) 0%,
                rgba(33,33,34,0.95) 100%
            );
        }

        .page-hero-inner {
            position: relative;
            z-index: 1;
            max-width: 1200px;
            width: 100%;
            margin: 0 auto;
            padding: 40px 24px;
        }

        .page-tag {
            font-size: 0.7rem;
            letter-spacing: 0.2em;
            color: var(--accent);
            text-transform: uppercase;
            margin-bottom: 10px;
        }

        .page-hero h1 {
            font-size: clamp(2rem, 5vw, 3.5rem);
            font-weight: 700;
            letter-spacing: -0.03em;
            text-shadow: 0 0 40px rgba(77,84,218,0.4);
        }

        /* ===== CONTENU PRINCIPAL ===== */
        main {
            flex: 1;
            max-width: 1200px;
            margin: 0 auto;
            padding: 64px 24px;
            width: 100%;
        }

        /* Grille des contacts */
        .contact-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 20px;
        }

        .contact-card {
            display: flex;
            align-items: center;
            gap: 18px;
            background-color: var(--card-bg);
            border: 1px solid rgba(77,84,218,0.12);
            border-radius: 12px;
            padding: 22px 24px;
            text-decoration: none;
            color: var(--text);
            transition: transform 0.3s ease, box-shadow 0.3s ease, border-color 0.3s ease;
        }

        .contact-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 0 8px var(--accent), 0 0 28px rgba(77,84,218,0.2);
            border-color: rgba(77,84,218,0.5);
        }

        .contact-card-icon {
            width: 52px;
            height: 52px;
            flex-shrink: 0;
            background-color: rgba(77,84,218,0.12);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .contact-card-icon img {
            width: 32px;
            height: 32px;
            object-fit: contain;
            /* Rend les icônes noires/sombres visibles sur fond sombre avec inversion */
            filter: invert(1) brightness(2);
        }

        /* Pour l'icône LinkedIn en noir, ne pas inverser */
        .contact-card-icon img.no-invert {
            filter: none;
        }

        .contact-card-info {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .contact-card-label {
            font-size: 0.65rem;
            letter-spacing: 0.12em;
            color: var(--accent);
            text-transform: uppercase;
        }

        .contact-card-value {
            font-size: 0.85rem;
            font-weight: 700;
            word-break: break-all;
        }

        /* Carte LinkedIn avec couleur spéciale */
        .contact-card.linkedin .contact-card-icon {
            background-color: rgba(10, 102, 194, 0.2);
        }

        .contact-card.linkedin .contact-card-label {
            color: #0a66c2;
        }

        .contact-card.linkedin .contact-card-value {
            color: #5aabff;
        }

        /* Section titre */
        .section-label {
            font-size: 0.7rem;
            letter-spacing: 0.2em;
            color: var(--accent);
            text-transform: uppercase;
            margin-bottom: 12px;
        }

        .section-title {
            font-size: clamp(1.4rem, 2.5vw, 2rem);
            font-weight: 700;
            letter-spacing: -0.02em;
            margin-bottom: 40px;
        }

        .section-title::after {
            content: "";
            display: block;
            width: 40px;
            height: 3px;
            background: var(--accent);
            box-shadow: 0 0 8px var(--accent);
            margin-top: 12px;
        }

        /* ===== FOOTER ===== */
        footer {
            text-align: center;
            padding: 32px 24px;
            font-size: 0.7rem;
            color: var(--text-dim);
            border-top: 1px solid rgba(255,255,255,0.06);
        }
    </style>
</head>
<body>

    <!-- ===== NAVIGATION ===== -->
    <header>
        <nav>
            <div class="nav-logo">AS.</div>
            <ul>
                <li><a href="index.html">Accueil</a></li>
                <li><a href="index.html#about">À propos</a></li>
                <li><a href="index.html#projects">Projets</a></li>
                <li><a href="formation.html">Formation</a></li>
                <li><a href="contact.html" class="active">Contact</a></li>
            </ul>
        </nav>
    </header>

    <!-- ===== HERO ===== -->
    <div class="page-hero">
        <div class="page-hero-inner">
            <div class="page-tag">// me contacter</div>
            <h1>Contact</h1>
        </div>
    </div>

    <!-- ===== CONTACTS ===== -->
    <main>
        <div class="section-label">// coordonnées</div>
        <h2 class="section-title">Mes contacts</h2>

        <div class="contact-grid">

            <!-- Mail -->
            <a class="contact-card" href="mailto:andreassa.acad@gmail.com">
                <div class="contact-card-icon">
                    <!-- Icône SVG inline mail -->
                    <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#4d54da" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="2" y="4" width="20" height="16" rx="2"/>
                        <polyline points="2,4 12,13 22,4"/>
                    </svg>
                </div>
                <div class="contact-card-info">
                    <span class="contact-card-label">Mail</span>
                    <span class="contact-card-value">andreassa.acad@gmail.com</span>
                </div>
            </a>

            <!-- Téléphone -->
            <a class="contact-card" href="tel:+33625866964">
                <div class="contact-card-icon">
                    <!-- Icône ou image Tel.png -->
                    <img src="Tel.png" alt="Téléphone">
                </div>
                <div class="contact-card-info">
                    <span class="contact-card-label">Téléphone</span>
                    <span class="contact-card-value">06 25 86 69 64</span>
                </div>
            </a>

            <!-- LinkedIn -->
            <a class="contact-card linkedin" href="https://www.linkedin.com/in/andr%C3%A9as-saussier-31a181300/" target="_blank" rel="noopener">
                <div class="contact-card-icon">
                    <img src="linkedin.png" alt="LinkedIn" class="no-invert">
                </div>
                <div class="contact-card-info">
                    <span class="contact-card-label">LinkedIn</span>
                    <span class="contact-card-value">Andréas Saussier</span>
                </div>
            </a>

            <!-- Localisation -->
            <div class="contact-card">
                <div class="contact-card-icon">
                    <img src="Location.png" alt="Localisation">
                </div>
                <div class="contact-card-info">
                    <span class="contact-card-label">Localisation</span>
                    <span class="contact-card-value">Montpellier, France</span>
                </div>
            </div>

        </div>
    </main>

    <!-- ===== FOOTER ===== -->
    <footer>
        © 2025 Andréas Saussier — Portfolio
    </footer>

</body>
</html>
