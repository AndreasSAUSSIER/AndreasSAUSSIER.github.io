<!DOCTYPE html>
<html lang="fr">
<head>
    <title>Projets — Andréas Saussier</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg:           #212122;
            --bg-dark:      #1a1a1b;
            --accent:       #4d54da;
            --accent-hover: #4145bb;
            --text:         #ffffff;
            --text-dim:     #a0a0b0;
            --card-bg:      #2a2a2c;
            --font:         'JetBrains Mono', monospace;
            --status-done:  #22c55e;
            --status-wip:   #f59e0b;
            --status-fail:  #ef4444;
            --status-pause: #6b7280;
        }

        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        html { scroll-behavior: smooth; }

        body {
            font-family: var(--font);
            background-color: var(--bg);
            color: var(--text);
            min-height: 100vh;
        }

        /* ===== NAVIGATION ===== */
        header {
            position: sticky;
            top: 0;
            z-index: 100;
            background-color: var(--bg-dark);
            border-bottom: 1px solid rgba(77,84,218,0.25);
            backdrop-filter: blur(8px);
        }

        nav {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 24px;
            height: 64px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .nav-logo {
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--accent);
            text-shadow: 0 0 10px rgba(77,84,218,0.6);
            text-decoration: none;
        }

        nav ul {
            list-style: none;
            display: flex;
            gap: 8px;
        }

        nav ul li a {
            display: inline-block;
            padding: 6px 18px;
            font-size: 0.75rem;
            font-family: var(--font);
            font-weight: 700;
            color: var(--text);
            text-decoration: none;
            background-color: var(--accent);
            border-radius: 5px;
            transition: background-color 0.3s, transform 0.3s, box-shadow 0.3s;
        }

        nav ul li a:hover, nav ul li a.active {
            background-color: var(--accent-hover);
            transform: scale(1.08);
            box-shadow: 0 0 6px var(--accent), 0 0 20px rgba(77,84,218,0.45);
        }

        /* ===== HERO ===== */
        .page-hero {
            position: relative;
            min-height: 300px;
            display: flex;
            align-items: flex-end;
            overflow: hidden;
            background-color: var(--bg-dark);
        }

        .page-hero::before {
            content: "";
            position: absolute;
            inset: 0;
            background: radial-gradient(ellipse 80% 60% at 60% 50%, rgba(77,84,218,0.15) 0%, transparent 70%);
        }

        .page-hero::after {
            content: "";
            position: absolute;
            inset: 0;
            background-image:
                linear-gradient(rgba(77,84,218,0.07) 1px, transparent 1px),
                linear-gradient(90deg, rgba(77,84,218,0.07) 1px, transparent 1px);
            background-size: 40px 40px;
            mask-image: linear-gradient(to bottom, transparent 0%, black 40%, black 60%, transparent 100%);
        }

        .page-hero-inner {
            position: relative;
            z-index: 1;
            max-width: 1200px;
            width: 100%;
            margin: 0 auto;
            padding: 48px 24px;
        }

        .page-tag {
            font-size: 0.7rem;
            letter-spacing: 0.2em;
            color: var(--accent);
            text-transform: uppercase;
            margin-bottom: 10px;
        }

        .page-hero h1 {
            font-size: clamp(2rem, 5vw, 3.5rem);
            font-weight: 700;
            letter-spacing: -0.03em;
        }

        .page-hero-sub {
            margin-top: 10px;
            font-size: 0.85rem;
            color: var(--text-dim);
        }

        /* ===== FILTRES ===== */
        .filters {
            max-width: 1200px;
            margin: 0 auto;
            padding: 32px 24px 0;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .filter-btn {
            padding: 6px 16px;
            font-family: var(--font);
            font-size: 0.72rem;
            font-weight: 700;
            border-radius: 100px;
            border: 1px solid rgba(77,84,218,0.3);
            background: transparent;
            color: var(--text-dim);
            cursor: pointer;
            transition: all 0.25s ease;
        }

        .filter-btn:hover { border-color: var(--accent); color: var(--accent); }

        .filter-btn.active {
            background-color: var(--accent);
            border-color: var(--accent);
            color: #fff;
            box-shadow: 0 0 8px rgba(77,84,218,0.4);
        }

        /* ===== GRILLE ===== */
        main {
            max-width: 1200px;
            margin: 0 auto;
            padding: 32px 24px 80px;
        }

        .projects-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 20px;
        }

        /* ===== CARTE ===== */
        .project-card {
            background-color: var(--card-bg);
            border: 1px solid rgba(77,84,218,0.12);
            border-radius: 14px;
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.35s ease, box-shadow 0.35s ease, border-color 0.35s ease;
            display: flex;
            flex-direction: column;
        }

        .project-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 0 8px var(--accent), 0 0 30px rgba(77,84,218,0.2);
            border-color: rgba(77,84,218,0.4);
        }

        .project-card.hidden { display: none; }

        .card-header {
            padding: 20px 22px 16px;
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 12px;
        }

        .card-title { font-size: 1rem; font-weight: 700; line-height: 1.3; }

        .badge {
            flex-shrink: 0;
            font-size: 0.6rem;
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            padding: 4px 10px;
            border-radius: 100px;
            border: 1px solid;
        }

        .badge-done  { color: var(--status-done);  border-color: var(--status-done);  background: rgba(34,197,94,0.1); }
        .badge-wip   { color: var(--status-wip);   border-color: var(--status-wip);   background: rgba(245,158,11,0.1); }
        .badge-fail  { color: var(--status-fail);  border-color: var(--status-fail);  background: rgba(239,68,68,0.1); }
        .badge-pause { color: var(--status-pause); border-color: var(--status-pause); background: rgba(107,114,128,0.1); }

        .card-meta { padding: 0 22px 14px; display: flex; gap: 8px; flex-wrap: wrap; }

        .tag {
            font-size: 0.63rem;
            padding: 3px 10px;
            border-radius: 100px;
            background: rgba(77,84,218,0.15);
            color: var(--accent);
            border: 1px solid rgba(77,84,218,0.25);
        }

        .card-date {
            font-size: 0.63rem;
            color: var(--text-dim);
            padding: 3px 10px;
            border-radius: 100px;
            border: 1px solid rgba(255,255,255,0.08);
        }

        .card-excerpt {
            padding: 14px 22px 20px;
            font-size: 0.78rem;
            color: var(--text-dim);
            line-height: 1.75;
            border-top: 1px solid rgba(255,255,255,0.05);
            flex: 1;
        }

        .card-footer {
            padding: 14px 22px;
            border-top: 1px solid rgba(255,255,255,0.05);
            display: flex;
            justify-content: flex-end;
        }

        .card-btn {
            font-family: var(--font);
            font-size: 0.7rem;
            font-weight: 700;
            color: var(--accent);
            background: none;
            border: 1px solid rgba(77,84,218,0.3);
            border-radius: 6px;
            padding: 6px 14px;
            cursor: pointer;
            transition: all 0.25s ease;
        }

        .card-btn:hover { background: var(--accent); color: #fff; box-shadow: 0 0 8px rgba(77,84,218,0.4); }

        /* ===== MODAL ===== */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.75);
            backdrop-filter: blur(6px);
            z-index: 200;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .modal-overlay.open { opacity: 1; pointer-events: all; }

        .modal {
            background: #252527;
            border: 1px solid rgba(77,84,218,0.3);
            border-radius: 16px;
            max-width: 720px;
            width: 100%;
            max-height: 85vh;
            overflow-y: auto;
            transform: translateY(24px);
            transition: transform 0.3s ease;
            box-shadow: 0 0 40px rgba(77,84,218,0.2);
        }

        .modal-overlay.open .modal { transform: translateY(0); }

        .modal::-webkit-scrollbar { width: 6px; }
        .modal::-webkit-scrollbar-track { background: transparent; }
        .modal::-webkit-scrollbar-thumb { background: rgba(77,84,218,0.4); border-radius: 3px; }

        .modal-header {
            padding: 28px 32px 20px;
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 16px;
            border-bottom: 1px solid rgba(255,255,255,0.07);
            position: sticky;
            top: 0;
            background: #252527;
            z-index: 1;
        }

        .modal-title-group { flex: 1; }

        .modal-title {
            font-size: 1.4rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            margin-bottom: 10px;
        }

        .modal-meta { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }

        .modal-close {
            background: none;
            border: 1px solid rgba(255,255,255,0.15);
            color: var(--text-dim);
            width: 34px;
            height: 34px;
            border-radius: 8px;
            font-size: 1.1rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            transition: all 0.2s;
        }

        .modal-close:hover { border-color: var(--accent); color: var(--accent); }

        .modal-body { padding: 28px 32px 32px; }

        .modal-section { margin-bottom: 28px; }

        .modal-section-title {
            font-size: 0.68rem;
            letter-spacing: 0.18em;
            text-transform: uppercase;
            color: var(--accent);
            margin-bottom: 10px;
        }

        .modal-section p {
            font-size: 0.82rem;
            color: var(--text-dim);
            line-height: 1.85;
        }

        .modal-section p + p { margin-top: 10px; }

        .modal-section ul { list-style: none; display: flex; flex-direction: column; gap: 6px; }

        .modal-section ul li {
            font-size: 0.8rem;
            color: var(--text-dim);
            line-height: 1.7;
            padding-left: 16px;
            position: relative;
        }

        .modal-section ul li::before { content: "›"; position: absolute; left: 0; color: var(--accent); }

        /* ===== IMAGES CARTE ===== */
        .card-image-container {
            width: 100%;
            height: 180px;
            overflow: hidden;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }

        .card-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.4s ease;
        }

        .project-card:hover .card-image {
            transform: scale(1.05);
        }

        /* ===== CARROUSEL MODALE ===== */
        .carousel {
            position: relative;
            width: 100%;
            height: 350px;
            background: #1a1a1b;
            border-radius: 12px;
            margin-bottom: 24px;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid rgba(255,255,255,0.05);
        }

        .carousel-img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            display: none;
        }

        .carousel-img.active {
            display: block;
            animation: fadeIn 0.3s ease;
        }

        .carousel-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(33, 33, 34, 0.8);
            color: var(--text);
            border: 1px solid rgba(77,84,218,0.5);
            width: 40px;
            height: 40px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            transition: all 0.2s;
            z-index: 10;
        }

        .carousel-btn:hover {
            background: var(--accent);
            box-shadow: 0 0 10px rgba(77,84,218,0.6);
        }

        .carousel-prev { left: 10px; }
        .carousel-next { right: 10px; }

        .carousel-dots {
            position: absolute;
            bottom: 12px;
            display: flex;
            gap: 8px;
            z-index: 10;
        }

        .carousel-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: rgba(255,255,255,0.3);
            cursor: pointer;
            transition: background 0.2s;
        }

        .carousel-dot.active { background: var(--accent); }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        
        /* ===== BOUTON GRAPHIQUE ===== */
        .btn-graphique {
            margin-left: auto;
            padding: 8px 18px;
            font-family: var(--font);
            font-size: 0.75rem;
            font-weight: 700;
            color: #fff;
            background-color: var(--card-bg);
            border: 1px solid var(--accent);
            border-radius: 8px;
            text-decoration: none;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
        }

        .btn-graphique:hover {
            background-color: var(--accent);
            box-shadow: 0 0 12px rgba(77,84,218,0.5);
            transform: translateY(-2px);
        }

        /* ===== VIDEO DANS LA MODALE ===== */
        .modal-video-container {
            margin-top: 32px;
            padding-top: 24px;
            border-top: 1px solid rgba(255,255,255,0.05);
        }

        .modal-video-title {
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--text);
            margin-bottom: 12px;
        }

        .iframe-wrapper {
            position: relative;
            padding-bottom: 56.25%; /* Ratio 16:9 */
            height: 0;
            border-radius: 8px;
            overflow: hidden;
            background: #000;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .iframe-wrapper iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }

        /* ===== COMPÉTENCES DANS LA MODALE ===== */
        .modal-skills-container {
            margin-top: 32px;
            padding-top: 24px;
            border-top: 1px solid rgba(255,255,255,0.05);
        }

        .modal-skills-grid {
            display: flex;
            flex-direction: column; /* C'est cette ligne qui force le passage à la ligne */
            align-items: flex-start; /* Aligne les badges sur la gauche */
            gap: 8px; /* Espacement légèrement réduit pour un affichage en colonne */
            margin-top: 12px;
        }

        .skill-tag {
            font-size: 0.72rem;
            font-weight: 700;
            padding: 6px 14px;
            border-radius: 6px;
            background: rgba(77, 84, 218, 0.08);
            color: #fff;
            border: 1px solid rgba(77, 84, 218, 0.3);
            transition: all 0.2s;
        }

        .skill-tag:hover {
            border-color: var(--accent);
            background: rgba(77, 84, 218, 0.2);
            transform: translateY(-1px);
        }

        @media (max-width: 640px) {
            nav ul { display: none; }
            .projects-grid { grid-template-columns: 1fr; }
            .modal-body, .modal-header { padding: 20px; }
        }
    </style>
</head>
<body>

    <header>
        <nav>
            <a href="index.html" class="nav-logo">AS.</a>
            <ul>
                <li><a href="index.html">Accueil</a></li>
                <li><a href="index.html#about">À propos</a></li>
                <li><a href="projets.html" class="active">Projets</a></li>
                <li><a href="formation.html">Formation</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>
        </nav>
    </header>

    <div class="page-hero">
        <div class="page-hero-inner">
            <div class="page-tag">// réalisations</div>
            <h1>Mes projets</h1>
            <p class="page-hero-sub" id="project-count"></p>
        </div>
    </div>

    <div class="filters">
        <button class="filter-btn active" data-filter="all">Tous</button>
        <button class="filter-btn" data-filter="Électronique">Électronique</button>
        <button class="filter-btn" data-filter="Embarqué">Embarqué</button>
        <button class="filter-btn" data-filter="3D / Impression">3D / Impression</button>
        <button class="filter-btn" data-filter="Mécanique">Mécanique</button>
        <button class="filter-btn" data-filter="Logiciel">Logiciel</button>
        <button class="filter-btn" data-filter="Universitaire">Universitaire</button>

        <a href="graphique.html" class="btn-graphique">Projets Graphiques 🎥</a>
    </div>

    <main>
        <div class="projects-grid" id="projects-grid">
            </div>
    </main>

    <div class="modal-overlay" id="modal-overlay">
        <div class="modal" id="modal">
            <div class="modal-header">
                <div class="modal-title-group">
                    <div class="modal-title" id="modal-title"></div>
                    <div class="modal-meta" id="modal-meta"></div>
                </div>
                <button class="modal-close" id="modal-close">✕</button>
            </div>
            <div class="modal-body" id="modal-body"></div>
        </div>
    </div>

    <footer>© 2025 Andréas Saussier — Portfolio</footer>

    <script src="projets.js"></script>
</body>
</html>
