<!DOCTYPE html>
<html lang="fr">
<head>
    <title>Projets Graphiques — Andréas Saussier</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        /* =============================================
           VARIABLES
        ============================================= */
        :root {
            --bg:         #212122;
            --bg-dark:    #1a1a1b;
            --accent:     #4d54da;
            --accent-hover: #4145bb;
            --text:       #ffffff;
            --text-dim:   #a0a0b0;
            --card-bg:    #2a2a2c;
            --font:       'JetBrains Mono', monospace;
        }

        /* =============================================
           RESET & BASE
        ============================================= */
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        html { scroll-behavior: smooth; }

        body {
            font-family: var(--font);
            background-color: var(--bg);
            color: var(--text);
            min-height: 100vh;
        }

        /* =============================================
           NAVIGATION
        ============================================= */
        header {
            position: sticky;
            top: 0;
            z-index: 100;
            background-color: var(--bg-dark);
            border-bottom: 1px solid rgba(77, 84, 218, 0.25);
            backdrop-filter: blur(8px);
        }

        nav {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 24px;
            height: 64px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .nav-logo {
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--accent);
            text-shadow: 0 0 10px rgba(77, 84, 218, 0.6);
            letter-spacing: -0.02em;
            text-decoration: none;
        }

        nav ul {
            list-style: none;
            display: flex;
            gap: 8px;
        }

        nav ul li a {
            display: inline-block;
            padding: 6px 18px;
            font-size: 0.75rem;
            font-family: var(--font);
            font-weight: 700;
            color: var(--text);
            text-decoration: none;
            background-color: var(--accent);
            border-radius: 5px;
            transition: background-color 0.3s ease, transform 0.3s ease, box-shadow 0.3s ease;
        }

        nav ul li a:hover, nav ul li a.active {
            background-color: var(--accent-hover);
            transform: scale(1.08);
            box-shadow: 0 0 6px var(--accent), 0 0 20px rgba(77, 84, 218, 0.45);
        }

        /* =============================================
           HERO SECTION
        ============================================= */
        .page-hero {
            position: relative;
            min-height: 250px;
            display: flex;
            align-items: flex-end;
            overflow: hidden;
            background-color: var(--bg-dark);
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }

        .page-hero-inner {
            position: relative;
            z-index: 1;
            max-width: 1200px;
            width: 100%;
            margin: 0 auto;
            padding: 48px 24px;
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            flex-wrap: wrap;
            gap: 20px;
        }

        .page-tag {
            font-size: 0.7rem;
            letter-spacing: 0.2em;
            color: var(--accent);
            text-transform: uppercase;
            margin-bottom: 10px;
        }

        .page-hero h1 {
            font-size: clamp(1.8rem, 4vw, 3rem);
            font-weight: 700;
            letter-spacing: -0.03em;
        }

        .btn-back {
            padding: 8px 16px;
            font-family: var(--font);
            font-size: 0.75rem;
            font-weight: 700;
            color: var(--text-dim);
            background: transparent;
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 8px;
            text-decoration: none;
            transition: all 0.3s;
        }

        .btn-back:hover {
            color: #fff;
            border-color: #fff;
            transform: translateY(-2px);
        }

        /* =============================================
           GRILLE VIDEOS
        ============================================= */
        main {
            max-width: 1200px;
            margin: 0 auto;
            padding: 40px 24px 80px;
        }

        .videos-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 24px;
        }

        .video-card {
            background-color: var(--card-bg);
            border: 1px solid rgba(77,84,218,0.12);
            border-radius: 14px;
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.35s ease, box-shadow 0.35s ease, border-color 0.35s ease;
        }

        .video-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 0 8px var(--accent), 0 0 30px rgba(77,84,218,0.2);
            border-color: rgba(77,84,218,0.4);
        }

        .thumbnail-container {
            position: relative;
            width: 100%;
            aspect-ratio: 16 / 9;
            background-color: #000;
            overflow: hidden;
        }

        .thumbnail {
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0.8;
            transition: opacity 0.3s, transform 0.4s;
        }

        .video-card:hover .thumbnail {
            opacity: 1;
            transform: scale(1.05);
        }

        .play-icon {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 50px;
            height: 50px;
            background: rgba(77,84,218,0.8);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 15px rgba(0,0,0,0.5);
            transition: background 0.3s, transform 0.3s;
        }

        .video-card:hover .play-icon {
            background: var(--accent);
            transform: translate(-50%, -50%) scale(1.1);
        }

        .play-icon::after {
            content: "";
            display: block;
            margin-left: 4px;
            border-style: solid;
            border-width: 10px 0 10px 16px;
            border-color: transparent transparent transparent #fff;
        }

        .video-info {
            padding: 16px;
        }

        .video-title {
            font-size: 0.9rem;
            font-weight: 700;
            line-height: 1.4;
        }

        /* =============================================
           MODAL VIDEO LECTEUR
        ============================================= */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.9);
            backdrop-filter: blur(8px);
            z-index: 200;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .modal-overlay.open { opacity: 1; pointer-events: all; }

        .video-modal-content {
            position: relative;
            width: 90%;
            max-width: 1000px;
            background: #111;
            border: 1px solid rgba(77,84,218,0.3);
            border-radius: 12px;
            padding: 16px;
            box-shadow: 0 0 50px rgba(77,84,218,0.2);
            transform: scale(0.95);
            transition: transform 0.3s ease;
        }

        .modal-overlay.open .video-modal-content { transform: scale(1); }

        .iframe-wrapper {
            position: relative;
            padding-bottom: 56.25%; /* Ratio 16:9 parfait */
            height: 0;
            border-radius: 8px;
            overflow: hidden;
            background: #000;
        }

        .iframe-wrapper iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }

        .modal-top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

        .modal-video-title {
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--text);
        }

        .btn-close {
            background: none;
            border: 1px solid rgba(255,255,255,0.2);
            color: var(--text-dim);
            width: 32px;
            height: 32px;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }

        .btn-close:hover {
            border-color: var(--accent);
            color: var(--accent);
        }

        /* Boutons de navigation carrousel vidéo */
        .nav-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: rgba(33, 33, 34, 0.8);
            border: 1px solid rgba(77,84,218,0.5);
            color: #fff;
            font-size: 1.2rem;
            cursor: pointer;
            z-index: 10;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }

        .nav-btn:hover {
            background: var(--accent);
            box-shadow: 0 0 15px rgba(77,84,218,0.6);
            transform: translateY(-50%) scale(1.1);
        }

        .nav-prev { left: -60px; }
        .nav-next { right: -60px; }

        @media (max-width: 1200px) {
            .nav-prev { left: -10px; }
            .nav-next { right: -10px; }
        }

        @media (max-width: 640px) {
            nav ul { display: none; }
            .page-hero-inner { flex-direction: column; align-items: flex-start; gap: 16px; }
        }

        /* =============================================
           FOOTER
        ============================================= */
        footer {
            text-align: center;
            padding: 32px 24px;
            font-size: 0.7rem;
            color: var(--text-dim);
            border-top: 1px solid rgba(255,255,255,0.06);
        }
    </style>
</head>
<body>

    <!-- ===== NAVIGATION ===== -->
    <header>
        <nav>
            <a href="index.html" class="nav-logo">AS.</a>
            <ul>
                <li><a href="index.html">Accueil</a></li>
                <li><a href="index.html#about">À propos</a></li>
                <li><a href="projets.html" class="active">Projets</a></li>
                <li><a href="formation.html">Formation</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>
        </nav>
    </header>

    <!-- ===== HERO ===== -->
    <div class="page-hero">
        <div class="page-hero-inner">
            <div>
                <div class="page-tag">// créations graphiques & 3D</div>
                <h1>Vidéos & Démos</h1>
            </div>
            <a href="projets.html" class="btn-back">← Retour aux projets</a>
        </div>
    </div>

    <!-- ===== GRILLE VIDEOS ===== -->
    <main>
        <div class="videos-grid" id="videos-grid">
            <!-- Les vidéos seront injectées ici par le JS -->
        </div>
    </main>

    <!-- ===== MODAL LECTEUR VIDEO ===== -->
    <div class="modal-overlay" id="video-modal">
        
        <button class="nav-btn nav-prev" id="btn-prev">❮</button>
        
        <div class="video-modal-content">
            <div class="modal-top-bar">
                <div class="modal-video-title" id="modal-video-title">Titre de la vidéo</div>
                <button class="btn-close" id="btn-close">✕</button>
            </div>
            <div class="iframe-wrapper">
                <iframe id="youtube-player" src="" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
            </div>
        </div>

        <button class="nav-btn nav-next" id="btn-next">❯</button>
    </div>

    <!-- ===== FOOTER ===== -->
    <footer>
        © 2026 Andréas Saussier — Portfolio
    </footer>

    <!-- ===== SCRIPT ===== -->
    <script>
        /* ==========================================================
           DONNÉES DES VIDÉOS (YouTube)
           Remplace les "id" par les identifiants de tes propres vidéos.
        ========================================================== */
        const videos = [
            { id: "WOsVxLk2wmw", title: "Façade 3d model" },
            { id: "yNWj0zyy2Vo", title: "Vidéo found footage 3d scene" },
            { id: "C5_dVkRww_w", title: "Backroom_2" },
            { id: "cebtKbRXROk", title: "Backroom_1" },
            { id: "kdfiPpqPE-o", title: "Matrix intro" }
        ];

        let currentIndex = 0;
        const grid = document.getElementById("videos-grid");
        const modal = document.getElementById("video-modal");
        const player = document.getElementById("youtube-player");
        const titleDisplay = document.getElementById("modal-video-title");

        // 1. Générer les cartes vidéos dans la grille
        videos.forEach((vid, index) => {
            const card = document.createElement("div");
            card.className = "video-card";
            // Récupère automatiquement la miniature YouTube "Haute Qualité"
            const thumbUrl = `https://img.youtube.com/vi/${vid.id}/hqdefault.jpg`;
            
            card.innerHTML = `
                <div class="thumbnail-container">
                    <img src="${thumbUrl}" alt="${vid.title}" class="thumbnail">
                    <div class="play-icon"></div>
                </div>
                <div class="video-info">
                    <div class="video-title">${vid.title}</div>
                </div>
            `;

            // Au clic, on ouvre la modale
            card.addEventListener("click", () => openVideo(index));
            grid.appendChild(card);
        });

        // 2. Fonction pour ouvrir et jouer une vidéo
        function openVideo(index) {
            currentIndex = index;
            const vid = videos[currentIndex];
            
            titleDisplay.textContent = vid.title;
            
            // Ajout de autoplay=1 et referrerpolicy pour éviter l'erreur 153
            player.src = `https://www.youtube.com/embed/${vid.id}?autoplay=1&rel=0`;
            player.setAttribute("referrerpolicy", "strict-origin-when-cross-origin");
            
            modal.classList.add("open");
            document.body.style.overflow = "hidden"; // Bloque le défilement de la page derrière
        }

        // 3. Fonction pour fermer la modale
        function closeVideo() {
            modal.classList.remove("open");
            document.body.style.overflow = "";
            
            // IMPORTANT : on vide la source pour couper le son de la vidéo
            setTimeout(() => { player.src = ""; }, 300); 
        }

        // 4. Navigation Carrousel (Précédent / Suivant)
        document.getElementById("btn-prev").addEventListener("click", () => {
            let newIndex = currentIndex - 1;
            if (newIndex < 0) newIndex = videos.length - 1; // Boucle vers la fin
            openVideo(newIndex);
        });

        document.getElementById("btn-next").addEventListener("click", () => {
            let newIndex = currentIndex + 1;
            if (newIndex >= videos.length) newIndex = 0; // Boucle vers le début
            openVideo(newIndex);
        });

        // 5. Gestion des fermetures (Croix, clic dans le fond, touche Echap)
        document.getElementById("btn-close").addEventListener("click", closeVideo);
        
        modal.addEventListener("click", (e) => {
            if (e.target === modal) closeVideo();
        });

        document.addEventListener("keydown", (e) => {
            if (e.key === "Escape" && modal.classList.contains("open")) closeVideo();
            if (e.key === "ArrowRight" && modal.classList.contains("open")) document.getElementById("btn-next").click();
            if (e.key === "ArrowLeft" && modal.classList.contains("open")) document.getElementById("btn-prev").click();
        });
    </script>
</body>
</html>
